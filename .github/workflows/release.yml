name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: verify-exact-tag
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      # setup-node is the authority in hosted release verification; the runner still validates .nvmrc exactly.
      AWF_PI_TEST_SKIP_NVM: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/pi-extension-test/package-lock.json
      - name: Verify checkout and tag identity
        run: |
          candidate='${{ github.sha }}'
          [ "$(git rev-parse HEAD)" = "$candidate" ]
          [ "$(git rev-parse "${GITHUB_REF_NAME}^{}")" = "$candidate" ]
      - name: Verify bridge readiness and exact CI conclusions
        run: go run ./cmd/releasecheck --verify-ci "${{ github.sha }}"
      - name: Verify tag matches project.Version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          want="$(go run ./cmd/awf version | awk '
            /^version: [^[:space:]()]+( \([^[:cntrl:]]+\))?$/ {
              if (found) { bad = 1; exit }
              found = 1
              value = substr($0, 10)
              sub(/ \(.*/, "", value)
              next
            }
            { bad = 1; exit }
            END { if (!bad && found == 1) print value; else exit 1 }
          ')"
          [ "$tag" = "$want" ]
      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Enable restricted rootless extraction
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true
      - name: Gate (test + 100% coverage + vet + lint)
        run: ./x gate
      - name: Covercheck mutation regression from previous release
        run: |
          candidate='${{ github.sha }}'
          # Only released vX.Y.Z tags below the current release define its range.
          # `git tag --merged` peels annotated tags; unrelated and future-version
          # tags cannot become mutation evidence.
          previous="$(git tag --merged "$candidate" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -Vu | awk -v current="$GITHUB_REF_NAME" '
            $0 == current { found = 1; print prior; exit }
            { prior = $0 }
            END { if (!found) exit 2 }
          ')"
          if [ -n "$previous" ]; then
            git cat-file -e "$previous^{commit}"
            ./x covercheck-mutants --select-range "$previous" "$candidate"
          else
            # First release has no trustworthy range; fail conservatively.
            ./x covercheck-mutants
          fi
      - name: Drift check (rendered output matches config)
        run: ./x check
      - name: Prepare release notes from the curated changelog
        run: go run ./cmd/awf changelog --version "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/release-notes.md"
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Repeat tag identity before publication
        run: |
          [ "$(git rev-parse HEAD)" = '${{ github.sha }}' ]
          [ "$(git rev-parse "${GITHUB_REF_NAME}^{}")" = '${{ github.sha }}' ]
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Prepare release notes from the curated changelog
        run: go run ./cmd/awf changelog --version "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/release-notes.md"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/releasecheck --verify-release-notes "${RUNNER_TEMP}/release-notes.md"
