name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build-exact-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Verify tag and source
        run: |
          [ "$(git rev-parse "${GITHUB_REF_NAME}^{}")" = '${{ github.sha }}' ]
          [ "${GITHUB_REF_NAME#v}" = "$(go run ./cmd/awf version | cut -d' ' -f2)" ]
          ./x gate
          ./x check
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: check
      - name: Build candidates without publication credentials
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --clean --skip=publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            dist/awf_*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 1

  native-linux-amd64:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.sha }}
          path: dist
      - run: tools/native-release-test/run.sh dist linux amd64 "${GITHUB_REF_NAME#v}"

  native-darwin-arm64:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.sha }}
          path: dist
      - run: tools/native-release-test/run.sh dist darwin arm64 "${GITHUB_REF_NAME#v}"

  publish:
    name: publish-verified-candidate
    needs: [native-linux-amd64, native-darwin-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ github.sha }}
          path: dist
      - name: Publish the tested files unchanged
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/awf_*.tar.gz dist/checksums.txt --generate-notes
