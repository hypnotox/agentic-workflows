name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: {go-version-file: go.mod}
      - name: Verify exact native Linux candidate
        run: '[ "$(git rev-parse HEAD)" = "${{ github.sha }}" ] && [ "$(go env GOOS)" = linux ] && [ "$(go env GOARCH)" = amd64 ]'
      - name: Exhaustive Go behavior
        run: ./x test
      - name: Build, blocking lint, version, and pins
        run: ./x gate
      - name: Drift, current state, and repository scans
        run: ./x check

  macos:
    name: macos-safety
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: {go-version-file: go.mod}
      - name: Verify exact native macOS candidate
        run: '[ "$(git rev-parse HEAD)" = "${{ github.sha }}" ] && [ "$(go env GOOS)" = darwin ]'
      - name: Filesystem, publication, Git, effort, and worktree safety
        run: go test -count=1 ./internal/filesystem ./internal/filepublication ./internal/git ./internal/effort ./internal/worktree

  pi:
    name: pi
    runs-on: ubuntu-latest
    env: {AWF_PI_TEST_SKIP_NVM: '1'}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: .nvmrc, cache: npm, cache-dependency-path: tools/pi-extension-test/package-lock.json}
      - run: '[ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]'
      - run: ./x pi-test run

  gate:
    name: gate
    if: ${{ always() }}
    needs: [linux, macos, pi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}'}
      - name: Require every assurance lane for the exact candidate
        run: |
          [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]
          [ '${{ needs.linux.result }}' = success ]
          [ '${{ needs.macos.result }}' = success ]
          [ '${{ needs.pi.result }}' = success ]
