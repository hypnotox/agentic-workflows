name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-coverage:
    name: linux-coverage-${{ matrix.workload }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workload: ['0-0', '0-1', '0-2', '0-3', '1-0', '1-1', '1-2', '1-3', '2-0', '2-1', '2-2', '3-0']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: {go-version-file: go.mod}
      - name: Verify exact native Linux candidate
        run: '[ "$(git rev-parse HEAD)" = "${{ github.sha }}" ] && [ "$(go env GOOS)" = linux ] && [ "$(go env GOARCH)" = amd64 ]'
      - name: Produce coverage evidence
        run: ./x coverage-produce '${{ matrix.workload }}' coverage-artifact '${{ github.sha }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: 'coverage-${{ matrix.workload }}', path: coverage-artifact, if-no-files-found: error}

  coverage-policy:
    name: coverage-policy
    needs: linux-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: {go-version-file: go.mod}
      - name: Verify exact candidate
        run: '[ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {pattern: 'coverage-*', path: coverage-artifacts}
      - name: Validate evidence and enforce coverage policy
        run: ./x coverage-aggregate coverage-artifacts
      - name: Upload raw coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        env: {CODECOV_TOKEN: '${{ secrets.CODECOV_TOKEN }}'}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with: {token: '${{ secrets.CODECOV_TOKEN }}', files: coverage.out, disable_search: true, flags: raw, fail_ci_if_error: true}
      - name: Upload covered coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        env: {CODECOV_TOKEN: '${{ secrets.CODECOV_TOKEN }}'}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with: {token: '${{ secrets.CODECOV_TOKEN }}', files: coverage.covered.out, disable_search: true, flags: covered, fail_ci_if_error: true}

  macos-native:
    name: macos-native-${{ matrix.workload }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        workload: ['0-0', '0-1', '0-2', '0-3', '1-0', '1-1', '1-2', '1-3', '2-0', '2-1', '2-2', '3-0']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: {go-version-file: go.mod}
      - name: Verify exact native macOS candidate
        run: '[ "$(git rev-parse HEAD)" = "${{ github.sha }}" ] && [ "$(go env GOOS)" = darwin ] && [ "$(go env GOARCH)" = arm64 ]'
      - run: ./x native-shard --workload '${{ matrix.workload }}'

  pi:
    name: pi
    runs-on: ubuntu-latest
    env: {AWF_PI_TEST_SKIP_NVM: '1'}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: {go-version-file: go.mod}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: .nvmrc, cache: npm, cache-dependency-path: tools/pi-extension-test/package-lock.json}
      - run: '[ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]'
      - run: ./x pi-test run

  analysis:
    name: analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: {go-version-file: go.mod}
      - name: Verify exact candidate and native build
        run: '[ "$(git rev-parse HEAD)" = "${{ github.sha }}" ] && [ "$(go env GOOS)" = linux ] && [ "$(go env GOARCH)" = amd64 ] && go run ./cmd/versioncheck && go build ./...'
      - name: Blocking lint, vet, and action pins
        run: 'go tool golangci-lint run && go vet ./... && go run ./cmd/pincheck'
      - name: Advisory lint and dead code
        run: 'go tool golangci-lint run --config .golangci-advisory.yml --issues-exit-code 0 && go tool deadcode -json ./... | go run ./cmd/deadcodecheck'
      - name: Cross builds
        run: 'for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do GOOS=${target%/*} GOARCH=${target#*/} go build ./...; done'
      - name: Drift and repository scans
        run: './x check && ./awf check repo prose && ./awf check repo memory'

  mutation:
    name: mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: {go-version-file: go.mod}
      - name: Verify exact candidate and range-qualified mutation
        env: {EVENT: '${{ github.event_name }}', PR_BASE: '${{ github.event.pull_request.base.sha }}', PUSH_BASE: '${{ github.event.before }}'}
        run: |
          [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]
          case "$EVENT" in pull_request) base="$PR_BASE";; push) base="$PUSH_BASE";; *) base=invalid-base;; esac
          ./x covercheck-mutants --select-range "$base" '${{ github.sha }}'

  gate:
    name: gate
    if: ${{ always() }}
    needs: [coverage-policy, macos-native, pi, analysis, mutation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}'}
      - name: Require all direct assurance dependencies
        run: |
          [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]
          [ '${{ needs.coverage-policy.result }}' = success ]
          [ '${{ needs.macos-native.result }}' = success ]
          [ '${{ needs.pi.result }}' = success ]
          [ '${{ needs.analysis.result }}' = success ]
          [ '${{ needs.mutation.result }}' = success ]

  release-config:
    name: release-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: {ref: '${{ github.sha }}', fetch-depth: 0}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: {go-version-file: go.mod}
      - name: Verify exact candidate
        run: '[ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]'
      - name: Enable restricted rootless extraction
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          unshare --user --map-root-user true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with: {version: v2.17.0, args: check}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with: {version: v2.17.0, args: release --snapshot --clean}
      - name: Verify exact snapshot archives
        run: go run ./cmd/releasecheck --verify-archives dist
