name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-full:
    name: linux-full
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      # setup-node is the authority in hosted CI; the runner still validates .nvmrc exactly.
      AWF_PI_TEST_SKIP_NVM: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/pi-extension-test/package-lock.json
      - name: Verify native Linux amd64
        run: '[ "$(go env GOOS)" = linux ] && [ "$(go env GOARCH)" = amd64 ]'
      - name: Enable restricted rootless extraction
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true
      - name: Gate (full Linux assurance)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          CANDIDATE: ${{ github.sha }}
        run: |
          case "$EVENT" in pull_request) base="$PR_BASE";; push) base="$PUSH_BASE";; *) base=invalid-base;; esac
          ./x gate full --range "$base" "$CANDIDATE"
      - name: Drift check (rendered output matches config)
        run: ./x check
      # The scans run in the pre-commit hook payload locally; hooks are
      # per-clone and optional, so CI is their enforcement backstop (ADR-0196).
      - name: Prose and memory scans
        run: |
          ./awf check repo prose
          ./awf check repo memory
      # coverage.out is written by ./x gate above (ADR-0196); no second suite run.
      - name: Filtered coverage profile (coverage-ignore blocks dropped)
        run: go run ./cmd/covercheck --emit-filtered coverage.out > coverage.covered.out
      # disable_search so each flag uploads ONLY its named file - otherwise the CLI
      # auto-discovers both .out files and merges them into every flag, collapsing
      # raw and covered to the same number.
      # Fork and dependabot PRs run without repo secrets: both uploads skip there
      # (ADR-0079) - coverage enforcement is ./x gate, Codecov is reporting only.
      - name: Upload raw coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          disable_search: true
          flags: raw
          fail_ci_if_error: true
      - name: Upload covered coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.covered.out
          disable_search: true
          flags: covered
          fail_ci_if_error: true

  macos-go:
    name: macos-go
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: {go-version-file: go.mod}
      - name: Verify native macOS arm64
        run: '[ "$(go env GOOS)" = darwin ] && [ "$(go env GOARCH)" = arm64 ]'
      - run: go test ./...

  gate:
    if: ${{ always() }}
    needs: [linux-full, macos-go]
    runs-on: ubuntu-latest
    steps:
      - name: Require native verification success
        run: |
          [ '${{ needs.linux-full.result }}' = success ]
          [ '${{ needs.macos-go.result }}' = success ]

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: check
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --snapshot --clean
