data:
  terms:
    - term: almanac
      meaning: "the sun-event model; approximates sunrise and sunset from latitude, longitude, and day of year (`internal/almanac`)"
    - term: cosine day-length model
      meaning: "the zero-dependency daylight approximation ADR-0001 adopts; accurate to minutes at temperate latitudes, deliberately wrong for navigation"
    - term: solar noon
      meaning: "the moment the sun crosses the local meridian; the model centres each day's daylight on it, shifted four minutes per degree of longitude"
    - term: sun table
      meaning: "the seven-row plain-text schedule `sundial` prints, one row per day, `rise`/`set` columns"
