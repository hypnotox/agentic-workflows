version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Bug detection
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - nilerr
    - bodyclose
    - errorlint
    - durationcheck
    - asasalint
    - nilnesserr
    - gocheckcompilerdirectives
    - makezero
    - exhaustive
    - wastedassign
  settings:
    govet:
      enable:
        - nilness
    exhaustive:
      default-signifies-exhaustive: true
    revive:
      rules:
        - name: exported
          disabled: true
    predeclared:
      ignore:
        - min
        - max
        - copy
    staticcheck:
      checks:
        - "SA0*"
        - "SA1*"
        - "SA2*"
        - "SA3*"
        - "SA4*"
        - "SA5*"
        - "SA9*"
  exclusions:
    presets:
      - std-error-handling
