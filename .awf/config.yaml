audit:
  allowedScopes:
    - name: adr
      meaning: ADR markdown documents
    - name: adr-system
      meaning: the ADR machinery code (INDEX.md generation, lifecycle)
    - name: awf
      meaning: genuinely cross-cutting / repo-meta work, the umbrella of last resort
    - name: code-design
      meaning: code-design authority and cross-package code structure
    - name: config
      meaning: the .awf config tree, schema, migrations
    - name: invariants
      meaning: invariant backing and checks
    - name: rendering
      meaning: the render engine and templates
    - name: tooling
      meaning: CLI, audit/gate, coverage, CI, ./x, changelog, evals
domains:
  - adr-system
  - config
  - invariants
  - rendering
  - tooling
  - code-design
currentState:
  sources:
    - globs:
        - '**/*.go'
      marker: //
  testGlobs:
    - '**/*_test.go'
prefix: awf
profile: full
vars:
  activeMdRegenCmd: ./x render
  checkCmd: ./x check
  commitGateCmd: ./awf check staged commit
  gateCmd: ./x gate
  gateCmdFull: ./x gate full
  invariantTestPath: ./internal/...
  testCmd: go test ./...
bootstrap:
  enabled: false
render:
  templateSourceRoot: templates
proseGate:
  exemptions:
    - path: docs/decisions/0113-em-dash-free-shipped-templates.md
      codepoint: U+2014
      count: 7
commitPolicy:
  grandfatheredThrough: c8d9df789b350b055f4fd20db2cd34a418e9f0e1
  allowedIdentities:
    - name: Josua Müller
      email: hypnotox@pm.me
  requireSignedCommits: true
  allowedSigners:
    - principal: hypnotox@pm.me
      key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF8DILJOI+TMmpnFxH0vS+3WuhYyFZHRIMfPfiLZYK18
integrationBranch: main
localDocs:
  - name: known-issues
    title: Known Issues
    description: Reproducible concrete defects with completion criteria
  - name: research/index
    title: Research
    description: Unresolved design questions and experiments with decision triggers
