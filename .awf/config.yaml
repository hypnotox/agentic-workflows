audit:
  allowedScopes:
    - name: adr
      meaning: ADR markdown documents
    - name: adr-system
      meaning: the ADR machinery code (INDEX.md generation, lifecycle)
    - name: awf
      meaning: genuinely cross-cutting / repo-meta work, the umbrella of last resort
    - name: code-design
      meaning: code-design authority and cross-package code structure
    - name: config
      meaning: the .awf config tree, schema, migrations
    - name: invariants
      meaning: invariant backing and checks
    - name: plans
      meaning: plan markdown documents
    - name: rendering
      meaning: the render engine and templates
    - name: tooling
      meaning: CLI, audit/gate, coverage, CI, ./x, changelog, evals
domains:
  - adr-system
  - config
  - invariants
  - rendering
  - tooling
  - code-design
currentState:
  sources:
    - globs:
        - '**/*.go'
      marker: //
    - globs:
        - '.awf/**/parts/**/*.md'
        - 'templates/**'
      marker: '<!-- awf:comment'
      close: '-->'
  testGlobs:
    - '**/*_test.go'
prefix: awf
profile: full
tags:
  adr-parsing: ADR frontmatter and section parsing
  catalog-derived-tests: Guards derived from the compile-time catalog
  changelog: The changelog and release-notes pipeline
  cli-dispatch: CLI command dispatch and kind routing
  closed-config-tree: The closed-config-tree drift model
  command-runner: The ./x project runner and the rendered ./awf wrapper
  commit-gate: The deterministic commit-message gate
  context-query: The awf context read-only query command
  convention-parts: Convention-part section overrides
  coverage-gate: The raw-identity coverage ratchet, ignore-accountability policy, and targeted mutation blocker
  cross-references: Inter-doc and ADR link references
  editable-sections: The awf:edit editable-section markers
  git-hooks: The git-hook payloads and their wiring
  gofmt-doccomment: gofmt doc-comment formatting quirks
  invariant-backing: Invariant declaration and proof-marker backing
  kind-descriptor: The unified per-kind descriptor
  link-resolution: Dead-link and reference resolution checks
  multi-target: Multi-target adapter rendering
  pinned-set-tests: Exact pinned-set test brittleness
  placeholder-degradation: Publication-safe placeholder degradation
  plan-artifact: The plan artifact structure and linking
  plan-taxonomy: Plan section and granularity conventions
  provenance-markers: In-file provenance markers on rendered output
  release-pipeline: The release and GoReleaser pipeline
  render-completeness: Render fan-out completeness guards
  repo-open: Tolerant git repository opening
  schema-migration: Config schema-generation migrations
  sidecar-fields: Sidecar data and section fields
  static-linting: golangci-lint static linting
  target-seam: The tool-agnostic target seam
  template-embed: go:embed template-embedding quirks
  template-overlay: The template overlay render engine
  template-residue: Template-source residue bans
  test-support: The shared test-support package
  verification-discipline: Verify-by-reading-back test discipline
  version-authority: The single binary-version authority
  worktree-isolation: Git worktree and index isolation
contextIgnore:
  - .awf/**
  - docs/**
  - .github/**
  - .githooks/**
  - changelog/**
  - LICENSE
  - go.mod
  - go.sum
  - README.md
  - codecov.yml
  - .gitignore
  - .golangci.yml
  - .golangci-advisory.yml
  - .goreleaser.yaml
  - .gremlins.yaml
vars:
  activeMdRegenCmd: ./x render
  checkCmd: ./x check
  commitGateCmd: ./awf check staged commit
  gateCmd: ./x gate
  gateCmdFull: ./x gate full
  invariantTestPath: ./internal/...
  testCmd: go test ./...
bootstrap:
  enabled: false
render:
  templateSourceRoot: templates
proseGate:
  exemptions:
    - path: docs/decisions/0113-em-dash-free-shipped-templates.md
      codepoint: U+2014
      count: 7
    - path: docs/plans/2026-07-13-invariant-backing-migration-to-enforced-test-scoped-backing.md
      codepoint: U+2014
      count: 1
commitPolicy:
  grandfatheredThrough: c8d9df789b350b055f4fd20db2cd34a418e9f0e1
  allowedIdentities:
    - name: Josua Müller
      email: hypnotox@pm.me
  requireSignedCommits: true
  allowedSigners:
    - principal: hypnotox@pm.me
      key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF8DILJOI+TMmpnFxH0vS+3WuhYyFZHRIMfPfiLZYK18
integrationBranch: main
localDocs:
  - name: known-issues
    title: Known Issues
    description: Reproducible concrete defects with completion criteria
  - name: research/index
    title: Research
    description: Unresolved design questions and experiments with decision triggers
