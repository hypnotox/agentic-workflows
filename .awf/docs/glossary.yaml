data:
  terms:
    - term: composition root
      meaning: "The outermost boundary with enough production knowledge to select volatile mechanisms and construct their consumers explicitly. It is wiring, not a service locator, a dependency bag, or an owner of the consumer's policy."
      domains: [code-design]
    - term: operation-owned derivation
      meaning: "A value derived during one operation and threaded to that operation's consumers rather than cached on a longer-lived value. The test against a construction input: could re-reading the source mid-lifetime change an outcome?"
      domains: [code-design]
    - term: project Loader
      meaning: "The project-opening policy object: it receives config-tree loading, the catalog, and resident-root resolution, then validates and derives one Project. `project.Open` remains transitional compatibility rather than the composed path."
      domains: [code-design]
    - term: presentation ownership
      meaning: "The package that owns a result model owns its human rendering, while a command binary keeps argument parsing, renderer selection, and exit mapping. Replaces the loosely-typed-map seam that rendered a renamed field as silently empty."
      domains: [code-design]
    - term: context state
      meaning: "The assembled seam value the context query consumes: layout, config, loaded current-state, tree, lock, output declarations, and eligible coverage universe. Built only by its two core-side constructors, so core's loading machinery stays unexported."
      domains: [tooling]
    - term: Roots anchoring value
      meaning: "The tracked and resident output roots as one construction input, built once at project open and owning anchored output-path resolution. Replaces per-call-site root joins as the single anchoring authority."
      domains: [rendering]
    - term: resident-root policy
      meaning: "The `internal/resident` package as the single home of the resident-root table, the path and kind predicates, anchoring, collisions, and uninstall. Nothing elsewhere re-derives the table; the git seam's own spelling is the recorded tolerated parallel."
      domains: [rendering]
    - term: trigger table
      meaning: "The guide's workflow section: a catalog-derived row per enabled skill, pairing its prefixed name with its one-line trigger. Rendered from a data key so a new skill cannot be dropped by a forgotten template edit."
      domains: [rendering]
    - term: handoff kickoff
      meaning: "The exact bounded `{kickoff}` prose passed to Pi session replacement. Workflow guidance supplies checkpoint reorientation; the runtime carries the text unchanged and owns replacement mechanics only."
      domains: [rendering]
    - term: safe resumable point
      meaning: "A durable checkpoint whose immediate successor can start independently."
      domains: [rendering]
    - term: session context facts
      meaning: "The transient model-facing line reporting current tokens against the active model window and the active-branch compaction count."
      domains: [rendering]
    - term: mandatory approval check-in
      meaning: "The chain's three hard stops: first-creation three-field confirmation, final grounded brainstorming approval, and settled ADR approval. Each stops for a later explicit user response; only the two final approvals persist a completed-phase summary."
    - term: anchored glob
      meaning: "awf's single glob dialect: a pattern matches a file's full slash-separated repo-relative path. `*.go` is top-level only, `**/*.go` any depth, `cmd/**` a subtree. No basename mode, deliberately stricter than gitignore."
      domains: [config]
    - term: authoring comment
      meaning: "A whole line that is exactly an `<!-- awf:comment ... -->` in a template default or convention part, stripped at ingestion so it never reaches rendered output. Exact-literal and whole-line only; the carrier for qualified `touches-state:` tags."
      domains: [rendering]
    - term: claim provenance
      meaning: "The authored links tying a claim to the ADRs behind it: a required `Origin:` naming the ADR that added it, plus an optional ordered `Revised-by:` of ADRs that later updated it. Structured navigation, never traversed as authority."
      domains: [invariants]
    - term: State changes
      meaning: "An ADR's operation declaration, each operation frozen once an Applied event references it: `None.` or a list of add, update, and remove entries naming qualified claim ids. Each appended batch travels with exactly its claim mutations."
      domains: [adr-system]
    - term: current-state topic
      meaning: "A domain-owned document of prose plus a final claims section, authored under `.awf/topics/parts/` and rendered under the docs tree. Its claims, not the ADR corpus, are what `awf context`, `awf check`, and `awf topic` read."
      domains: [invariants]
    - term: context relationship
      meaning: "A marker-kind association between a selected file or directory and a qualified claim: `State`, `Touches`, or `Proofs`. A file's relationships come only from its own markers; a directory keeps a separate union across included descendants."
      domains: [tooling]
    - term: context tier
      meaning: "The request-sensitive `awf context` projection: a bare directory receives tier-0 census, grouping, provenance, and topics, while a bare exact or Git-selected file additionally receives tier-1 direct relationships."
      domains: [tooling]
    - term: adaptive maximum
      meaning: "An exploration breadth limit: start with the cheapest targeted lookup, widen only when evidence requires it, never pass the selected breadth, and report explicitly when that boundary is exhausted."
      domains: [rendering]
    - term: claim
      meaning: "One identified normative unit of a current-state topic: a rule or invariant heading, at least one prose line, and a canonical-ordered metadata block. Its identity `<domain>/<topic>:<slug>` is globally unique and is what every marker and operation targets."
      domains: [invariants]
    - term: absorbing tombstone
      meaning: "The semantics of an applied claim remove: the qualified id is absent from that moment, and a concurrently developed update integrating later is retained as dominated history. Both integration orders converge to the same attributed absence."
      domains: [adr-system]
    - term: dominated operation
      meaning: "An applied update whose claim an applied remove already absorbed. It is retained as history, establishes no current claim, requires no claim mutation, and provides no authority."
      domains: [adr-system]
    - term: application batch
      meaning: "One implicit terminal application, or one explicit Applied event carrying a nonempty, duplicate-free unordered membership set of not-yet-applied operations. Its identity is its position in the owning ADR's ordered history occurrence."
      domains: [adr-system]
    - term: decision index
      meaning: "The generated decisions index: in-flight ADRs by number, title, and status, and terminal ones under a compact history. It infers no currentness and renders no supersession chains, because current authority is read from topic claims."
      domains: [adr-system]
    - term: topic coverage
      meaning: "The per-domain check that owned paths are described by current-state topics. One owner's topic never satisfies another owner's gap, and a global topic never satisfies scoped coverage. Coverage ranks error and fan-out warn; neither is configurable."
      domains: [invariants]
    - term: checker-cmd idiom
      meaning: "The shape shared by the repo-only gate and release checkers: a coverage-ignored `main` that only exits a unit-tested `run(args, stdout, stderr) int` seam, so the logic meets the coverage floor while the wrapper stays one line."
      domains: [tooling]
    - term: claimed-path model
      meaning: "The allowlist deciding what may live under `.awf/`, derived from config, catalog, and the output plan's write files, with the owned resident roots exempt. Anything outside it is failing drift, reported at the topmost unclaimed directory."
      domains: [config]
    - term: command spec
      meaning: "One entry in the CLI command table: a command's name, flags, positional bounds, gating classification, help text, and any subcommands. The single source of help, the usage line, argument validation, and the gated-command list."
      domains: [tooling]
    - term: gating classification
      meaning: "The four-valued gating on a command spec: `inherit` (a group child resolving to its parent's), `ungated`, `gated` (the driver gates before the handler), or `gated-in-handler`. A top-level command is never `inherit`, having no parent."
      domains: [tooling]
    - term: config reference
      meaning: "The always-on generated doc listing every config key, var, sidecar field, and data key with descriptions, defaults, availability, and the project's live state. Regeneration-checked, its tables not part-overridable; queryable via `awf config`."
      domains: [config]
    - term: configspec
      meaning: "The compile-time, adopter-facing description authority: one entry per adopter-settable config key, sidecar field, and data key, with var entries derived from the catalog descriptors. Parity and description residue are both test-enforced."
      domains: [config]
    - term: deletion-as-acknowledgement
      meaning: "The var three-state model: a key set is configured, present-but-empty is the seeded to-do the unset-var note nudges, and absent is the deliberate decline that silences it for good. Rendering degrades identically for every unset state."
      domains: [config]
    - term: domain paths
      meaning: "A domain's file territory: anchored globs under `paths:` in its domain sidecar. Input to the `domain-code-staleness` audit rule, which warns on territory churn without a current-state co-change; a domain without `paths` opts out."
      domains: [config]
    - term: example adopter
      meaning: "The committed full-surface adoption at `examples/sundial/`: a fictional Go CLI in its own module with a complete `.awf/` tree, everything enabled, and all rendered output checked in. Re-rendered by `./x render` and held note-free by `./x check`."
      domains: [tooling]
    - term: dormant doc-gated skill
      meaning: "A skill enabled while its required doc is disabled, a legacy state that silently rendered nothing. The `close-enabled-set` migration drops it, preserving observed output; the state is now refused at open."
      domains: [rendering]
    - term: plan op
      meaning: "A single enable-array change in an `awf enable` or `awf disable` resolver plan: one artifact node, a direction, and required-by provenance. Printed one per line before any config change; a whole plan lands in one rewrite."
      domains: [tooling]
    - term: invariant backing
      meaning: "The ledger-not-proof model: a `Backing: test` claim is satisfied by a matching proof-marker comment in a test file, a textual match blind to whether that test asserts the invariant. `Backing: unbacked` forbids a marker and requires a `Verify:` line."
      domains: [invariants]
    - term: promotion ladder
      meaning: "The retrospective's routing rule for a recurring, codifiable observation: promote it to the strongest rung it can support, an invariant with its backing marker, a gate test or lint rule, a code-review focus item, or a pitfalls note."
    - term: project search universe
      meaning: "The broad exploration boundary: tracked files plus non-ignored untracked files under the repository root, including tracked generated and vendored ones. Ignored files, `.git`, nested repositories, and external dependencies are excluded unless scoped."
    - term: prose knob
      meaning: "A catalog var descriptor whose only effect is tuning the wording of rendered prose, the category the catalog bans. Contrast a functional value: a command, an enforced identifier set, or a path the tooling executes. Prose customization uses convention parts."
      domains: [config]
    - term: quality oracle
      meaning: "The example adopter's second role: because `./x render` re-renders it on every template change, rendered-output quality regressions land as reviewable diffs over a realistic adoption in the commit that caused them."
      domains: [rendering]
    - term: resync
      meaning: "The plan and ADR reconciliation pass that runs before implementation when both exist; it re-runs the scope-completeness and doc-currency lenses to catch plan-versus-finalised-ADR drift and loops until they converge."
    - term: seed-on-introduction
      meaning: "The convention keeping absence a reliable deletion signal: the release that adds a catalog var descriptor ships a one-time migration seed, run once via the generation gate, so a later deletion is never resurrected."
      domains: [config]
    - term: stub
      meaning: "Must-replace starter content: a section default declared with the `stub` attribute, or a convention part carrying the whole-line `<!-- awf:stub -->` marker. Rendered publication-safe but reported by the unauthored-content advisory until authored."
      domains: [rendering]
    - term: sync provenance line
      meaning: "The per-file cause `awf render` prints when a rendered file moves against the prior lock: `template`, `config`, `template+config`, `internal`, `regenerated`, or `added`. First syncs and byte-identical re-renders print nothing."
      domains: [rendering]
    - term: template source residue
      meaning: "awf-specific content surviving in shipped prose: a concrete ADR citation, or a repo-identity literal outside the pinned exemption list. Source-level scans cover the embedded templates and the catalog's shipped strings, which reach adopter trees alike."
      domains: [rendering]
    - term: trust-bearing file
      meaning: "A file other decisions trust without re-derivation: the lock, and the authored `config.yaml` when a migration rewrites it. Written atomically; a present-but-unreadable lock is a hard error in every reader."
      domains: [invariants]
    - term: upgrade porcelain
      meaning: "The rendered `.awf/upgrade.sh`, the deliberately nondeterministic layer over the deterministic `.awf/bootstrap.sh`: it resolves a target version, fetches through the bootstrap, and execs `awf upgrade` as its final statement."
      domains: [tooling]
    - term: working memory
      meaning: "One active effort's always-owned `.awf/efforts/<slug>/memory.md`, carrying phase, next action, brief, decisions, observations, and handoff log. Repository authority outranks it; one writer updates it, and a replacement session logs its actual boundary first."
      domains: [rendering]
    - term: sidecar-derived doc
      meaning: "The computed-doc model: a render transform computes content from the artifact's own sidecar data upstream of both render and config hash, keeping the doc in the ordinary drift model. Contrast regeneration, which derives from repo state outside the sidecar."
      domains: [rendering]
    - term: pitfall entry
      meaning: "One `{title, domains, related, body}` unit of `data.pitfalls`: the transform emits it as a `## title` section, its optional `domains:` must resolve to configured domains, and its optional `related:` ADR numbers render as plain text and are link-validated."
      domains: [rendering]
    - term: git seam
      meaning: "The `internal/git` package as the single home of every form of Git access: each capability is one semantic entrypoint, and whether it runs a library in process or the git binary is an internal detail no consumer can observe."
      domains: [tooling]
    - term: seam entrypoint
      meaning: "One exported operation of the git seam: a method on the repo handle, or a free function that precedes an opened repository or does without one. Every entrypoint is registered against the contract suite that pins it."
      domains: [tooling]
    - term: contract suite
      meaning: "A backend-agnostic test pinning what a seam entrypoint answers rather than how, so the semantics survive a backend swap and a swap becomes detectable. Not the cancellation, error-identity, or isolation suites, which cut across every entrypoint."
      domains: [tooling]
    - term: single home
      meaning: "A policy or mechanism consumed from more than one package has exactly one implementation, in the package that owns the concern. A second is a defect, not a variant, and is never forked to avoid an uncovered branch."
      domains: [code-design]
    - term: actionable outcome protocol
      meaning: "A closed result model that states observed state, records which retry-sensitive axes changed, and gives ordered executable remedies. It carries a cause exactly when observation itself failed."
      domains: [code-design]
    - term: grab-bag home
      meaning: "A production package or file named for a topical pile rather than one owned concern, such as util, common, helpers, or misc. New production code and deliberate conversions may not create one."
      domains: [code-design]
    - term: global test seam
      meaning: "A package-level variable reassigned by tests. New seams of this form are banned; existing census entries remain bounded conversion candidates until constructor or parameter injection replaces them."
      domains: [code-design]
    - term: export earns its consumer
      meaning: "A new or deliberately converted exported symbol ships with an outside-package production consumer in the same transaction. Narrow documented exceptions cover test exports, composition boundaries, and error identities."
      domains: [code-design]
    - term: routine checkpoint
      meaning: "The autonomous boundary that validates effort ownership, updates its memory, and classifies whether user attention is required. A clear boundary continues with a continuity notice and may choose eligible Pi session replacement without making persistence discretionary."
      domains: [rendering]
    - term: check-in
      meaning: "A deliberate stop that names the issue, options, recommendation, and blocked next action, then waits for the user. Distinct from a continuity notice and from mandatory design approval."
      domains: [rendering]
    - term: continuity notice
      meaning: "A routine checkpoint's informational one-line summary of the completed phase and immediate next action. It is never an intervention point and does not stop autonomous continuation."
      domains: [rendering]
    - term: memory-backed effort
      meaning: "Retired term for split effort ownership. Every current effort owns its memory file; a minimal simple fix has no effort, and standalone memory does not exist."
      domains: [tooling]
    - term: pending ADR
      meaning: "A full decision record identified by a retained slug before integration assigns its number. It is reviewable and implementable while pending; the integration branch refuses it until numbering runs."
      domains: [adr-system]
    - term: integration branch
      meaning: "The explicitly configured branch onto which finished work integrates. ADR authoring there allocates a number immediately; authoring elsewhere produces a pending slug record numbered during integration."
      domains: [config, adr-system]
    - term: retrospective
      meaning: "The terminal workflow step after settled review and managed-topology removal: reflect on the work, record durable lessons, promote recurring findings toward deterministic checks, and finish the effort last."
      domains: [rendering]
