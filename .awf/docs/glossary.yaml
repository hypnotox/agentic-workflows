data:
  terms:
    - term: composition root
      meaning: "The outermost boundary that selects volatile mechanisms and explicitly constructs their consumers. It is not a service locator, dependency bag, or owner of consumer policy."
      domains: [code-design]
    - term: operation-owned derivation
      meaning: "A value derived during and threaded through one operation rather than cached on a longer-lived value."
      domains: [code-design]
    - term: project Loader
      meaning: "The project-opening policy object that loads the config tree and derives one Project from the catalog and resident-root resolution. `project.Open` is transitional compatibility, not the composed path."
      domains: [code-design]
    - term: presentation ownership
      meaning: "The package owning a result model also owns its human rendering; a command binary owns argument parsing, renderer selection, and exit mapping."
      domains: [code-design]
    - term: context state
      meaning: "The assembled value consumed by a context query: layout, config, current state, tree, lock, output declarations, and eligible coverage universe."
      domains: [tooling]
    - term: Roots anchoring value
      meaning: "The construction input that combines tracked and resident output roots and resolves anchored output paths."
      domains: [rendering]
    - term: resident-root policy
      meaning: "The `internal/resident` package is the single home for resident-root paths, kinds, anchoring, collisions, and uninstall."
      domains: [rendering]
    - term: trigger table
      meaning: "The catalog-derived guide row for each skill, pairing its prefixed name with its one-line trigger."
      domains: [rendering]
    - term: safe resumable point
      meaning: "A durable checkpoint whose immediate successor can start independently."
      domains: [rendering]
    - term: mandatory approval check-in
      meaning: "The pre-artifact stop for explicit brainstorming outline approval. Effort creation is not an approval boundary."
    - term: anchored glob
      meaning: "awf's glob dialect, where a pattern matches a full slash-separated repo-relative path: `*.go` is top-level, `**/*.go` any depth, and `cmd/**` a subtree."
      domains: [config]
    - term: authoring comment
      meaning: "A whole-line `<!-- awf:comment ... -->` in a template default or convention part, stripped at ingestion. It carries qualified `touches-state:` tags."
      domains: [rendering]
    - term: claim provenance
      meaning: "Links tying a claim to its ADR history: required `Origin:` and optional ordered `Revised-by:`. They aid navigation, not authority."
      domains: [invariants]
    - term: State changes
      meaning: "An ADR's operation declaration, with each operation frozen once an Applied event references it: `None.` or add, update, and remove entries naming qualified claim ids. Each batch travels with its claim mutations."
      domains: [adr-system]
    - term: current-state topic
      meaning: "A domain-owned document whose metadata and authored current-state part define claims read by `awf context`, `awf check`, and `awf topic`. Its claims, not ADRs, are current authority."
      domains: [invariants]
    - term: source marker
      meaning: "An informational `awf:source` comment on generated documentation that points to reader-facing authorities without defining an edit boundary or dependency list."
      domains: [rendering]
    - term: regeneration-derived document
      meaning: "A managed document recomputed from repository or catalog state rather than only its template and sidecar."
      domains: [rendering]
    - term: context relationship
      meaning: "A `State`, `Touches`, or `Proofs` marker association between a selected file or directory and a qualified claim. File relationships come from their own markers; directory relationships union included descendants."
      domains: [tooling]
    - term: context tier
      meaning: "The request-sensitive `awf context` projection: bare directories receive tier-0 census, grouping, provenance, and topics; bare exact or Git-selected files also receive tier-1 direct relationships."
      domains: [tooling]
    - term: adaptive maximum
      meaning: "An exploration breadth limit that starts with the cheapest targeted lookup, widens only on evidence, and reports exhaustion."
      domains: [rendering]
    - term: claim
      meaning: "One globally identified normative unit of a current-state topic: a rule or invariant heading, prose, and canonical metadata. Its `<domain>/<topic>:<slug>` identity is targeted by markers and operations."
      domains: [invariants]
    - term: absorbing tombstone
      meaning: "The semantics of an applied claim remove: the qualified id is absent, and later-integrated concurrent updates remain dominated history."
      domains: [adr-system]
    - term: dominated operation
      meaning: "An applied update absorbed by an applied remove: retained as history but establishing no current claim or authority."
      domains: [adr-system]
    - term: application batch
      meaning: "One implicit terminal application or explicit Applied event containing a nonempty, duplicate-free unordered set of not-yet-applied operations. Its identity is its position in the owning ADR history."
      domains: [adr-system]
    - term: decision index
      meaning: "The generated decisions index listing in-flight ADRs by number, title, and status and terminal ADRs as compact history. It does not infer currentness or render supersession chains."
      domains: [adr-system]
    - term: topic coverage
      meaning: "The per-domain check that current-state topics describe owned paths. Global topics apply everywhere but cover only explicit paths in their domain; error and fan-out warning ranks are fixed."
      domains: [invariants]
    - term: checker-cmd idiom
      meaning: "A repo-only gate or release checker with a coverage-ignored `main` that exits a unit-tested `run(args, stdout, stderr) int` seam."
      domains: [tooling]
    - term: claimed-path model
      meaning: "The allowlist of paths permitted under `.awf/`, derived from config, catalog, and output-plan write files, excluding owned resident roots. Unclaimed content is drift reported at its topmost directory."
      domains: [config]
    - term: command spec
      meaning: "One CLI command-table entry defining a command's name, flags, positional bounds, gating, help text, and subcommands."
      domains: [tooling]
    - term: gating classification
      meaning: "A command spec's `inherit`, `ungated`, `gated`, or `gated-in-handler` classification. `inherit` resolves a group child's parent and cannot apply to a top-level command."
      domains: [tooling]
    - term: config reference
      meaning: "The always-on generated document listing every config key, var, sidecar field, and data key with its description, default, availability, and live state."
      domains: [config]
    - term: configspec
      meaning: "The compile-time adopter-facing authority with one entry per adopter-settable config key, sidecar field, and data key; var entries derive from catalog descriptors."
      domains: [config]
    - term: deletion-as-acknowledgement
      meaning: "The var three-state model: set is configured, present-but-empty is the seeded to-do, and absent is a deliberate permanent decline."
      domains: [config]
    - term: domain paths
      meaning: "A domain's `paths:`-declared anchored-glob file territory, which bounds topic ownership, context, and coverage."
      domains: [config]
    - term: invariant backing
      meaning: "The ledger-not-proof model: `Backing: test` requires a text-matched proof marker but does not prove the test asserts the claim; `Backing: unbacked` forbids a marker and requires `Verify:`."
      domains: [invariants]
    - term: promotion ladder
      meaning: "The retrospective rule that promotes a recurring codifiable observation to the strongest supportable form: invariant, gate or lint rule, review focus, or pitfall."
    - term: project search universe
      meaning: "Tracked and non-ignored untracked files under the repository root, excluding ignored files, `.git`, nested repositories, and external dependencies unless scoped."
    - term: prose knob
      meaning: "A prohibited catalog var descriptor that only tunes rendered prose; prose customization uses convention parts. Functional values drive commands, enforced identifiers, or executed paths."
      domains: [config]
    - term: linked-plan review freshness
      meaning: "The rule that ordinary full plan review verifies every parsed plan-level `adrs:` link, and substantive ADR corrections settle through ADR review before linked Proposed plans and landed-phase assurance renew."
    - term: seed-on-introduction
      meaning: "The convention that a release adding a catalog var descriptor ships a one-time migration seed, keeping later absence a reliable deletion signal."
      domains: [config]
    - term: stub
      meaning: "Must-replace starter content: a section default with the `stub` attribute or a convention part with a whole-line `<!-- awf:stub -->` marker."
      domains: [rendering]
    - term: sync provenance line
      meaning: "The per-file cause printed when `awf render` changes a rendered file against the previous lock: `template`, `config`, `template+config`, `internal`, `regenerated`, or `added`."
      domains: [rendering]
    - term: template source residue
      meaning: "awf-specific content surviving in shipped prose: a concrete ADR citation or repo-identity literal outside the pinned exemption list."
      domains: [rendering]
    - term: trust-bearing file
      meaning: "A file trusted without re-derivation: the lock or migration-rewritten authored `config.yaml`. It is written atomically, and an unreadable present lock is always an error."
      domains: [invariants]
    - term: upgrade porcelain
      meaning: "The rendered `.awf/upgrade.sh` layer over deterministic `.awf/bootstrap.sh` that resolves a version, fetches through bootstrap, and finally execs `awf upgrade`."
      domains: [tooling]
    - term: working memory
      meaning: "An active effort's `.awf/efforts/<slug>/memory.md`, carrying its phase, next action, brief, decisions, observations, and handoff log. Repository authority outranks it."
      domains: [rendering]
    - term: effort scratch
      meaning: "An optional `.awf/efforts/<slug>/scratch/` directory for disposable effort-local data, whose real-directory boundary awf validates without scaffolding or traversing descendants."
      domains: [tooling]
    - term: effort archive
      meaning: "The ignored machine-local `.awf/effort-archive/` root where finish preserves complete residents as `<uuid>-<slug>`. Archives are unmanaged, non-authoritative, and manually disposable."
      domains: [tooling]
    - term: sidecar-derived doc
      meaning: "The computed-document model where a render transform derives content from an artifact's sidecar before rendering and config hashing. Unlike regeneration, it does not derive from repository state outside the sidecar."
      domains: [rendering]
    - term: pitfall entry
      meaning: "One path-derived authored Markdown source under `.awf/docs/pitfalls/`, created with `awf new pitfall <title>`; deleting it retires the entry through render pruning."
      domains: [rendering]
    - term: pitfall publications
      meaning: "The compact generated `docs/pitfalls.md` metadata index and same-slug generated leaves, derived from authored pitfall sources."
      domains: [rendering]
    - term: git seam
      meaning: "The `internal/git` package is the single home of Git access, exposing one semantic entrypoint per capability independent of its backend."
      domains: [tooling]
    - term: seam entrypoint
      meaning: "One exported git-seam operation: a repository-handle method or a free function before or without an opened repository."
      domains: [tooling]
    - term: contract suite
      meaning: "A backend-agnostic test that pins a seam entrypoint's answers rather than its implementation. Cancellation, error-identity, and isolation suites are separate cross-cutting suites."
      domains: [tooling]
    - term: single home
      meaning: "A policy or mechanism consumed by multiple packages has exactly one implementation in its owning package."
      domains: [code-design]
    - term: actionable outcome protocol
      meaning: "A closed result model that states observed state, retry-sensitive changes, and ordered executable remedies; it carries a cause only when observation failed."
      domains: [code-design]
    - term: grab-bag home
      meaning: "A production package or file named for a topical pile, such as util, common, helpers, or misc; new production code and deliberate conversions may not create one."
      domains: [code-design]
    - term: global test seam
      meaning: "A package-level variable reassigned by tests. New seams of this form are banned; existing ones are conversion candidates."
      domains: [code-design]
    - term: export earns its consumer
      meaning: "A new or deliberately converted exported symbol has an outside-package production consumer in the same transaction, except documented test exports, composition boundaries, and error identities."
      domains: [code-design]
    - term: routine checkpoint
      meaning: "The autonomous boundary that validates effort ownership, updates memory, and classifies whether user attention is required."
      domains: [rendering]
    - term: check-in
      meaning: "A deliberate stop naming the issue, options, recommendation, and blocked next action for the user. It differs from a continuity notice; a mandatory approval check-in is its unconditional approval subtype."
      domains: [rendering]
    - term: continuity notice
      meaning: "A routine checkpoint's informational one-line summary of the completed phase and immediate next action; it does not stop autonomous continuation."
      domains: [rendering]
    - term: pending ADR
      meaning: "A reviewable and implementable decision record identified by a retained slug before integration assigns its number."
      domains: [adr-system]
    - term: integration branch
      meaning: "The configured branch for finished-work integration, where ADR authoring allocates numbers; elsewhere authoring produces pending records numbered during integration."
      domains: [config, adr-system]
    - term: retrospective
      meaning: "The terminal workflow step after settled review and managed-topology removal that records durable lessons and finishes the effort last."
      domains: [rendering]
