data:
    commands:
        - cmd: go test ./...
          desc: run the test suite
        - cmd: ./x gate
          desc: run the gate before committing
        - cmd: ./x check
          desc: check rendered-file drift
        - cmd: ./awf upgrade
          desc: migrate the config tree after upgrading awf
        - cmd: ./awf audit
          desc: report workflow conformance for a commit range
        - cmd: ./awf new plan "<Title>"
          desc: scaffold a dated implementation plan
        - cmd: ./awf new pitfall "<Title>"
          desc: scaffold one authored pitfall source without rendering
    invariants:
        - ref: ADR-0001, ADR-0045
          text: '**Publication-safe templates.** Keep unset interpolation coherent and token-free.'
        - text: '**`awf check` is the drift oracle.** After `.awf/` edits run `./x render && ./x check`; commit generated outputs with their sources.'
        - kind: scopes
        - ref: ADR-0134
          text: '**Backed invariants.** Declare and prove current-state invariants; see the current-state contract.'
        - ref: ADR-replace-plain-punctuation-ban-with-punctuation-restraint
          text: '**Punctuation restraint.** Prefer ordinary punctuation; prohibit en dashes and use at most two em dashes per paragraph in tracked text. Ellipses and curly quotes are permitted; see the prose gate contract.'
        - ref: ADR-0158, ADR-0175
          text: '**No memory citation.** Never cite concrete effort memory paths in durable records.'
        - ref: ADR-hybrid-raw-coverage-ratchet-and-targeted-mutation-regression
          text: '**Coverage identity ratchet.** Keep `./x gate` green against the canonical raw-miss baseline, critical selectors, ignore evidence, and targeted `cmd/covercheck` mutation blocker.'
        - ref: ADR-0063
          text: '**Dead-code gate.** Keep production code reachable from a `main`.'
        - kind: gated-commands
          ref: ADR-0039
