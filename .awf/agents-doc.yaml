data:
    commands:
        - cmd: go test ./...
          desc: run the test suite
        - cmd: ./x gate
          desc: run the fast commit gate before committing
        - cmd: ./x check
          desc: check rendered-file drift
        - cmd: ./awf upgrade
          desc: migrate the config tree after upgrading awf
        - cmd: ./awf audit
          desc: report workflow conformance for a commit range
        - cmd: ./awf new pitfall "<Title>"
          desc: scaffold one authored pitfall source without rendering
    invariants:
        - text: '**Publication-safe templates.** Keep unset interpolation coherent and token-free.'
        - text: '**`awf check` is the drift oracle.** After `.awf/` edits run `./x render && ./x check`; commit generated outputs with their sources.'
        - kind: scopes
        - text: '**Backed invariants.** Declare and prove current-state invariants; see the current-state contract.'
        - text: '**Punctuation restraint.** Prefer ordinary punctuation; punctuation findings are advisory Warnings with zero exit. En dashes remain prohibited and paragraphs use at most two em dashes. Ellipses and curly quotes are permitted; see the prose gate contract.'
        - text: '**No memory citation.** Never cite concrete effort memory paths in durable records.'
        - text: '**Dead-code gate.** Keep production code reachable from a `main`.'
        - kind: gated-commands
