data:
    # focusItems replaces the catalog defaults wholesale (see pitfalls); the
    # first two entries are the catalog defaults, kept deliberately.
    focusItems:
        - name: plan-adherence
          description: the diff matches the plan's stated file paths and content; unexplained drift is a finding
        - name: test-coverage
          description: behaviour changes carry tests in the same commit; no assertion is weakened to pass
        - name: two-sided-set-checks
          description: when code compares two collections (lock vs rendered set, catalog pool vs on-disk files, declared vs on-disk parts), verify both directions are walked; one-sided iteration caused three independent check blind spots in the 2026-07-07 audit batch
        - name: part-placeholder-escaping
          description: 'a convention part that quotes a `\\{{=awf:key}}` token as documentation must backslash-escape it; an unescaped consumable token is silently substituted into the published output (the value where the token name belongs) with `awf check` clean, so only reading the rendered file catches it. Bit the ADR-0086 docs commit (rendering current-state part); the intent is ambiguous to a machine (substituting inside backticks is also legitimate), so this stays a judgment check: quoted-as-syntax means escaped, meant-to-resolve means bare'
        - name: coverage-ignore-reachability
          description: 'a new or retained coverage exclusion (`coverage-ignore`, `c8 ignore`, or equivalent) states a reachability claim; try to refute it by staging the state it declares impossible (e.g. the file combination or call order it rules out) before accepting it. A comment saying the branch is tested is not a justification for excluding it: remove the exclusion and confirm the coverage report proves that claim. Treat an ignore *inherited through a refactor* (call sites merged, signature changed, callers widened) as unproven by default, since the claim was written against the old shape. Three false Go claims surfaced on 2026-07-08 (stampLockSchema, the sectionDefault call site, gate''s "TOCTOU-only") and four more on 2026-07-09 (the singleton-standard-docs relocate cluster, all carried through a refactor), each hiding a reachable branch. The Pi dashboard review repeated the pattern with broad `c8 ignore` blocks over lifecycle code whose comments claimed exhaustive tests; the exclusions themselves prevented coverage from substantiating that claim.'
        - name: repo-boundary-enumeration
          description: 'code or tests that enumerate or open the repo tree must define their repository boundary: a filesystem walk prunes nested checkouts (a subdirectory with its own `.git` entry, directory or gitdir-pointer file) and takes a deliberate stance on hidden dirs; a repo open resolves the gitfile layout. The Go toolchain is immune (dot-dirs and nested modules invisible to `./...`), hand-rolled walkers are not; three independent instances on 2026-07-10 (audit gitfile open, config_test legacy-ref sweep into .claude/worktrees/, invariants scanner backed by nested-checkout markers). Git-history-based enumeration is immune by construction. A fourth instance landed 2026-07-18 (the ADR-0127 range-parser scan) despite this item, so the boundary is now stated once in `testsupport.WalkRepoSources`: a new repo-wide walk uses that helper rather than hand-rolling the prune'
        - name: invariant-proof-exercises-its-claim
          description: 'ENUMERATE every invariant claim the diff adds or changes and check each one separately; do not spot-check. An `invariant: <domain>/<topic>:<slug>` proof marker must exercise the whole claim it backs, not one instance of it: try mutating each clause the claim asserts and confirm the test fails. A marker that cannot fail is worse than none - it reads as backing while checking nothing, and it holds a green gate over a wrong implementation. Two markers in the ADR-0127 session were nominal (`audit-empty-range-clean`, `audit-reports-evaluated-scope`). This item did not prevent a third and much larger recurrence: the ADR-0128/0129/0130 session shipped roughly nine of twenty new slugs partially backed, two of them (`supersession-model-derives-state`, `supersession-model-single-source`) not merely untested but actively contradicted by the shipped code on Implemented ADRs, and one (`supersession-contested-anchor-advisory`) hiding a real defect that printed a wrong advisory on every commit of the implementation. In that session the first review pass missed them all and only an explicit enumeration in the verify pass found them, which is why this item now demands enumeration rather than judgment. A PRE-EXISTING marker falls outside that enumeration and can stay nominal indefinitely, since a review only revisits what the diff touches: on 2026-07-19 `TestCheckTokenRetirementIgnoresItemTokens` read as proof that a non-retirement token does not retire a slug, but passed only because item tokens carry an empty `Slug` and were excluded by an unrelated guard, so it never exercised the relation filter it appeared to prove. That masked a missing filter which let an inert `cites-invariant:` citation silently drop a live invariant''s backing, green gate and no drift. So when a diff RELIES on an existing test as evidence that a property is already covered, break the property and confirm that test fails before accepting the claim. A sharper trigger surfaced on 2026-07-19, in a diff whose author wrote the test AND the implementation in one sitting: when an implementation is SHAPED a particular way to prevent a specific regression, the test must fail when that shape is undone. `adr-related-ascending` declared three clauses and its test exercised one, so both mutations of the deliberate design passed it - deleting the loop-terminating `break`, and merging the ordering scan back into the resolution loop so a descent aborts the dangling-link scan, which is the precise failure the split-loop structure exists to prevent. The code comment explained the design and the test did not pin it. Read every "I did X so that Y cannot happen" comment in the diff as a test obligation, and undo X to confirm the suite goes red. A claim''s SURFACE SET is part of what the proof must exercise: when a clause quantifies over sites ("no rendered site", "every skill body", "each target"), enumerate the site CLASSES and confirm the proof reads each, because a sweep that walks the obvious class reads as exhaustive while leaving the rest free. ADR-0160 needed three rounds to converge. Its first sweep read one target''s skill bodies over a curated name list, so reinstalling the banned prose in the other target''s conditional branch, or in any skill outside the list, stayed green. The second widened to every skill body on both targets and still skipped the neutral docs, which is where that same decision had just placed the protocol''s canonical home, so the exact defect the ADR existed to remove could be reinstalled at the authoritative site with the whole suite green. Neither escape was visible by reading; both took a mutation. A claim whose clauses span TWO LAYERS needs a marker on each: ADR-0159''s `group-child-gating-honored` says gating resolves from the child so an ungated child under a gated parent is honoured rather than silently gated, and its only marker sat on the pure resolver test in `internal/clispec`, which stays green when the driver in `cmd/awf` is reverted to reading the parent''s gating. The resolver half was proved and the honouring half, the part the claim exists for, was not. When a claim names a producer and a consumer, mutate the CONSUMER and confirm something fails; a marker on the layer that is easiest to test reads as backing for both. A predicate that REPLACES several distinct conditions needs one mutation per replaced condition; mutating the new predicate wholesale is not enough, and a source-substring pin is not a behavioural proof of any of them. On 2026-07-29 ADR-0176 collapsed `value.length < 3 || slash <= 0 || slash === value.length - 1 || /\s/.test(value)` into a single shared regex. The author did mutation-test, by reverting the whole regex, and the suite went red, which read as proof. It was not: the only thing still rejecting an empty provider was a one-codepoint hole (0x2F) in the provider character class, and widening just that class left all fifty behavioural tests green while `/a/b` began parsing as an empty provider. Only a Go source-substring assertion in a different suite caught it, and a text pin cannot prove behaviour. Enumerate the conditions the replaced expression enforced and confirm at least one behavioural case fails for each. An Applied BATCH that extends a Backing: test claim''s prose is a claim change even when its diff touches no code: the ADR-0189 batch-2 commit extended two rendering claims with worktree-default clauses that no proof assertion observed, every phase review passed because a prose-only diff shows no assertion gap, and only the terminal enumeration caught it; the settlement added the assertions and mutation-confirmed each. Run the enumeration on docs-only claim batches too'
        - name: verification-instrument-can-fail
          description: 'for EACH mechanical check the diff ADDS or CHANGES - a repo-walking test, a registry or table assertion, a grep post-check, a lint rule - establish that it can FAIL before accepting that it passes. A green instrument and a blind one are indistinguishable from output alone, and this is not hypothetical: within one effort a post-check regexp could not match the only call shape left and reported completeness over two unconverted files, a hand-rolled walker duplicated the repository''s walk boundary and would have failed on the target after integration, and a registry check was satisfied for half its entries by the test function''s own name because it printed the declaration rather than the body. Ask where the negative case is; if the suite has none, plant the violation the check exists to catch and confirm red. Treat a check whose subject is a regexp over source, and a check reused from a neighbouring context, as the two shapes most likely to be silently narrower or wider than the rule they claim to enforce.'
        - name: claim-prose-no-broader-than-reality
          description: 'for EACH current-state claim the diff adds or changes, read the claim SENTENCE against the shipped artifact and ask whether every universal in it is actually true. This is the opposite direction from the proof check above and no mutation finds it: mutation proves the test matches the code, never that the claim sentence matches either, and claim prose is not machine-checked, so `awf check` stays clean over a false sentence indefinitely. Two shapes recurred in the ADR-0177 session, on two different claims, one round apart. First, a claim was authored from the plan while only half its subject matter had landed: `implementer-role-contract` said both dispatching skills address their imperatives to an explicit subject when only one of them did, so fixing the code side was mistaken for settling the finding, and the claim then still asserted a universal because it had also dropped the ADR''s qualifier ("every subject-less imperative A CHILD COULD READ as addressed to itself") and quantified over roughly twenty imperatives that keep no subject. Second, a settlement narrowed the CODE and left the claim alone: `pi-implement-role-artifact` said the snapshot fails a commit-capable call whose HEAD is unchanged, full stop, while the shipped guard had gained a `!result.failed` clause during review, so the claim was false for exactly the subset a new test proved. So when a review finding fixes one side of a claim, RE-READ the claim sentence for residual over-breadth before calling it settled, and when a settlement narrows a condition the claim describes, check whether the claim still describes it. Compare the claim against the DECISION that authorized it too, not only against the code: a claim quietly broader than its ADR item is the same defect one layer up, and once the ADR is frozen the only remedies are a successor `update` operation or a code change that makes the sentence true.'
        - name: commit-contents-match-message
          description: 'for EACH commit in the range, check that what the message claims is actually in the diff: `git show --stat <sha>` against the subject and body, not the cumulative range diff, which hides a per-commit mismatch by summing it away. A message naming a file, an ADR, or an artifact it does not touch is the signal. This is not pedantry about wording - it catches an edit lost between the gate run and the commit, which a shared checkout makes easy: a concurrent session can revert an uncommitted file, and `git add -A` then commits a subset while the message describes the whole. On 2026-07-19 commit `7d327c7c` said it narrowed ADR-0131 s code-span declaration and reopened the ADR; `docs/decisions/0131-*.md` was not in the commit at all. Only the test half landed, so a proof marker was left asserting the opposite of the invariant sentence it was marked as proving - strictly worse than the defect being fixed, and invisible to the gate because prose is not checked and the tree was green either way. The same commit swept in 206 lines of another session s in-progress ADR. Also flag the inverse: a file in the diff that no part of the message accounts for.'
        - name: readiness-predicate-over-proposed-tree
          description: 'a bridge/migration predicate that GATES on state the same run also NORMALIZES must evaluate the proposed post-normalization result, not raw HEAD or the pre-normalization tree, or it deadlocks: read-only `upgrade --check` cannot pre-write what only attestation-time normalization produces. On 2026-07-20 (Plan 2 Phases 1-2) readiness rejected a legacy invariant retired by an effective token because its encoded `## Migration history` ledger line was absent, though `PlanNormalization` plans to append that exact line - attestation needs readiness, but readiness demanded the artifact only attestation writes. The fixtures pre-wrote the ledger and masked it, which is the second half of the trap: a fixture that bakes in the tool''s OWN planned mutation cannot exercise the from-scratch path, so a real corpus (tokens present, ledger not yet written) hits a deadlock no green test saw. When reviewing Plan 3/4 proposed-tree work, confirm each gating predicate reads the post-normalization projection and at least one fixture omits the planned mutation the tool is supposed to generate'
        - name: migration-executed-not-read
          description: 'a migration that rewrites authored files (anything under the decisions dir, or config the adopter wrote) must be RUN against the real corpus before review concludes, not reasoned about from the diff. Reading cannot see what running shows: the generation-12 supersession-keys migration shipped three defects past code review that a single real run surfaced instantly - a slug anchor emitted with the item key so the token was inert, a stale `DecisionEnd` offset that appended into the following heading and silently deleted every slug an ADR declared (surfacing far away as unrelated token-ref drift), and a block-style list whose key line was stripped leaving orphan entries, producing invalid YAML and a corpus that no longer parsed. Check equally that the migrated corpus is CHECK-CLEAN, not merely that the expected strings appear: asserting token substrings is what let a chained-supersession defect through'
        - name: comment-anchoring-survives-insertion-and-deletion
          description: 'a comment or marker binds to the declaration that FOLLOWS it, so inserting a test or helper into an existing file silently re-anchors any comment block or `invariant:`/`touches-state:` marker it lands under. Check each insertion point in the diff for a preceding comment it now separates from its subject. Both shapes landed in one session on 2026-07-31: a new test inserted between two tooling/context-and-topic markers and the census test they backed left `context-path-classification`, whose ONLY proof repo-wide that marker was, pointing at a test exercising one of its eight classifications; and a helper inserted between writeValidJournal''s doc comment and writeValidJournal left the comment describing the wrong function. Neither is visible to the gate or to `awf check` - the marker still resolves to A test and the code still compiles - and neither is visible in the diff hunk either, because the displaced comment is unchanged context rather than a changed line. Open the file at each insertion point. This is the cheap positional cause of the nominal-proof class the roadmap tracks separately. DELETION is the mirror case and lands the same way: cutting a declaration from its own line forward to the NEXT declaration also removes the comment block belonging to that next one. On 2026-07-31 removing a single test that way stripped two `invariant:` markers off the following test, taking both claims from two backing sites to one; `awf check` requires only that a test-backed claim retain at least ONE marker anywhere, so nothing went red. Census the `invariant:`/`touches-state:` markers in any diff that deletes a declaration, and compare against the parent rather than reading the diff.'
        - name: dependency-composition-authority
          description: when the diff changes dependency selection, ownership, or wiring, consult code-design/dependency-composition and flag speculative capability or a capability without one concrete first consumer
        - name: state-ownership-authority
          description: when the diff changes what a value owns, where derived state lives, or the lifetime of a cache, consult code-design/state-ownership and flag a field written after construction, a derivation stored on a value that outlives its operation, and any correctness that rests on a caller remembering to reset, reload, or order a call
        - name: single-home-authority
          description: when the diff adds or converts a shared policy or mechanism, consult code-design/single-home and flag a second implementation of a concern another package already owns, a reduced copy where configuring the shared one would serve, and any fork or added coverage escape justified by coverage rather than by a materially different contract from a distinct source
        - name: presentation-ownership-authority
          description: when the diff changes where a result model is rendered for humans, or adds such a rendering, consult code-design/presentation-ownership and flag rendering that lives outside the package owning the model, and any model crossing a package boundary as a loosely-typed map whose discarded assertions turn a renamed field into a silently empty render under a green gate
        - name: outcome-modeling-authority
          description: when the diff changes how an outcome is surfaced, matched, or asserted, consult code-design/outcome-modeling and flag a production branch on a message substring, a new shallow os.Is* predicate call, a new error identity without a branching consumer in the same transaction, a test asserting error text where identity is the contract, and a new repository-state refusal outside the actionable outcome protocol
    correctnessTraps:
        - description: error paths; every returned error is checked or explicitly ignored with a stated reason
        - description: boundary conditions at empty, zero, and null/nil inputs
        - description: error returns must wrap with %w to preserve the error chain
        - description: nil map/pointer dereferences; check before indexing or method calls
        - description: missingkey=zero renders a no-value token for missing interface{} entries. Keep vars complete; awf check catches this post-sync
        - description: template FuncMap functions must handle empty-string vars gracefully
    docCurrencyItems:
        - check: the change updates every document that states the old behaviour, in the same commit
        - check: 'plan Notes records every deviation surfaced during execution before the plan status flips to Implemented; a deviation living only in a commit body is a finding (recurred: topic-authority hardening LegacyBaseline omission, ADR-0152 guarded-recovery omission)'
        - check: docs/decisions/INDEX.md regenerated by ./x render when ADR frontmatter changes
        - check: AGENTS.md reflects workflow/convention changes
        - check: new project jargon introduced by the change carries a docs/glossary.md entry in the same change (recurred ADR-0067, ADR-0069, ADR-0082)
        - check: 'changelog/CHANGELOG.md [Unreleased] still describes shipped adopter-facing behavior when the range changes rendered template output, CLI behavior, or the config/lock schema; the repo-local audit changelog warning is a doc-currency finding, not noise.'
