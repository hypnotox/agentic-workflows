data:
    # docCurrencyItems replaces the catalog defaults wholesale (see pitfalls):
    # this project's ADR-to-topic obligations under the current-state authority
    # model (ADR-0133, ADR-0135), not the generic decision-index reminder.
    docCurrencyItems:
        - check: every document that states the behaviour this ADR changes is updated in the same commit
        - check: AGENTS.md updated when the workflow chain or conventions change
        - check: "every claim named in this ADR's `## State changes` is authored to match in the same Implemented commit: an `add` claim appears with this ADR as `Origin`, an `update` claim appends this ADR to `Revised-by` and changes a canonical field, and a `remove` claim is gone (ADR-0135 items 8 and 9)"
        - check: "each State changes operation's destination topic metadata exists before the ADR reaches Accepted, an empty topic shell for a pending add (ADR-0135 item 5)"
        - check: "an `update` preserves the claim's `Origin` and the exact prior `Revised-by` prefix and changes a canonical field other than formatting or provenance; a rename is `remove` plus `add`; a removed id is never reused"
        - check: "RATIONALE QUALITY at each operation - the reviewer's job alone, since awf check proves only that the operation is structurally valid, not that it is warranted. The Decision item behind each add/update/remove must actually explain why that specific claim is created, changed, or retired (ADR-0135)."
    focusItems:
        - description: ADRs that change the config-tree schema or the lock format must enumerate all consumers (config, render, manifest, migrate) and confirm backward compatibility or a migration path.
          name: Schema stability
        - description: ADRs touching templates must confirm the missingkey=zero constraint is preserved; no template may render a no-value token when vars are empty strings.
          name: Template invariants
        - name: dependency-composition-authority
          description: when the ADR changes dependency selection, ownership, or wiring, consult code-design/dependency-composition and flag a speculative capability or a capability without one concrete first consumer
        - name: state-ownership-authority
          description: when the ADR changes what a value owns, where derived state lives, or the lifetime of a cache, consult code-design/state-ownership and flag a field written after construction, a derivation stored on a value that outlives its operation, and any correctness that rests on a caller remembering to reset, reload, or order a call
        - name: claim-agrees-with-its-own-decision
          description: 'read EACH claim this ADR adds or updates against the Decision items of THIS SAME ADR, and flag any clause that contradicts one. No mechanical layer catches this: backing validation is structural, so it confirms a proof marker exists and never compares claim prose to the Decision or to what the proof asserts, and a decision that disagrees with itself leaves every layer mutually consistent and the gate green. ADR-0183 shipped exactly this defect and it survived two schema generations: item 1 committed to "topic coverage and topic fan-out always evaluate" while the same ADR''s `config/configuration:severity-not-configurable` claim ended "a tree that declares no currentState block requests neither", and a test pinned the claim''s side, so the implementation followed the claim and nothing ever went red. ADR-0192 had to correct it. The asymmetry to watch for is a claim clause that quietly scopes, qualifies, or excepts something the Decision states without qualification, and an aside appended to a claim about a different subject is where it hides.'
