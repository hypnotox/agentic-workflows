data:
    focusItems:
        - name: step-exactness
          description: Reject task-level boundaries, cross-phase definitions, dead-code exceptions, plan-wide mode inference, and placeholders.
        - name: quoted-command-output-is-rerun
          description: 'a plan that quotes a command and its expected output states a checkable fact: RUN it rather than reasoning about it, and never write a corrected number you have not observed. A review of the ADR-0128 plan "corrected" a `grep -rn adr.ParseDir(` count from 10 to 12 on the theory that two `coverage-ignore` comments matched; they read `adr.ParseDir here`, with no opening paren, so the pattern never matched them and BOTH the before and after numbers shipped wrong. An unverified correction makes a plan less accurate than leaving it alone, because the executor now trusts it. Escalate rather than correct when a plan asserts a literal COUNT at all: prefer a terminal-state assertion (the finding count reaches zero, the grep returns nothing, the drift check is clean), because a count is a measurement of a corpus that moves and a stale one fails misleadingly rather than loudly. The 2026-07-19 retrofit-D plan showed the compound form: its headline total was a merge-base measurement, its item/slug split was wrong at every commit, its sibling plan carried a third figure, and because four later figures were derived from the total, one stale measurement made every phase unverifiable. Correcting such numbers one at a time treats the symptom; the fix is to delete them in favour of the command'
        - name: claimed-enforcement-exists
          description: 'a plan step that justifies an instruction by naming a mechanism that will CATCH the mistake ("reds the gate", "the check refuses it", "drift surfaces it") asserts the mechanism exists: locate it in the source before accepting the step, exactly as the sibling item demands a quoted command be rerun. A phantom mechanism is worse than no claim, because it converts a step the executor must perform carefully into one they believe is backstopped, and it fails silently and only later. The 2026-07-19 retrofit-D plan told its executor twice that an out-of-order `related:` array "reds the gate" and a commit message repeated it; nothing enforced array order, and two ADRs had been out of order for months with `awf check` clean throughout. The three mid-array inserts that plan performed were correct only because a separate instruction told the executor to read each array first. When the claim is worth making, the honest resolutions are to build the mechanism (ADR-0131 Decision 10 did, so the claim is now true) or to restate the step as an instruction the executor must follow unaided'
        - name: phase-boundary-is-gateable
          description: 'each phase must be able to pass the gate ALONE, which is stronger than dependency order. Two shapes break it silently: a phase that removes or changes an invariant claim while the ADR declaring the `remove`/`update` operation stays Proposed (the claim mutation is checked only in the ADR''s Implemented transaction, so a claim edited a phase early is owed-but-mismatched), and a phase that introduces a function before the phase that first calls it (the dead-code gate refuses it). The ADR-0128 plan hit both - Phases 6 and 7 had to merge, and three model methods were written, deleted, and re-added a phase later. Place the claim mutation and the ADR status flip in the same phase, and a model method in the phase that consumes it'
        - name: v2-batch-partition-legality
          description: 'a plan applying a V2 ADR incrementally must keep the Implementing state legal at every intermediate commit: at least one applied AND at least one remaining operation (internal/adr/application.go refuses an all-applied Implementing state), with the final Applied batch paired with the Implemented flip in one commit. The 0157 plan drafted a partition that exhausted all operations two phases before the flip. Check partition legality per planned commit, and that no plan pre-computes a content-sha256 stamp'
        - name: generated-adopter-source-closure
          description: >-
              when a plan requires a generated output to change in the root project or an example adopter,
              it must name the authored input that drives that output in each project; do not infer that a root
              convention part fans out into an adopter with its own config tree, and flag any required generated
              diff that has no declared authored source and render step
        - name: dependency-order
          description: tasks are ordered so each builds only on already-completed work
        - name: terminal-state-reachable-at-its-position
          description: 'a task that declares a terminal state (a command reaching a clean verdict, a grep returning nothing) asserts that state is reachable AT THAT POINT IN THE ORDERING, not merely eventually. Check the position, not just the command. The 2026-07-30 state-ownership plan ordered its render-and-check task BEFORE the task appending the ADR''s Applied batch, so its declared `awf check: clean` could not be reached: the four new claims'' `Origin` and the updated claim''s `Revised-by` are illegal until the batch exists, and the check failed on exactly that at execution time. The plan had ALREADY recorded "a post-check that cannot go green is worse than none, because it reads as verified" after its resync pass found three unrunnable greps, and shipped a fourth instance anyway one section away, which is why this is its own item rather than a clause in step-exactness. The sibling item demands a quoted command be rerun; this one demands it be rerun FROM THE STATE THE PRECEDING TASKS LEAVE, since a command that goes green at the end of the phase can be red where the plan actually places it'
        - name: gate-clean-embedded
          description: >-
              plan-embedded Go, commit subjects, and rendered-doc snippets already satisfy the
              gate the executor will run; commit subjects ≤72 chars (check commit), constant-string
              `fmt.Errorf`→`errors.New` and number `fmt.Sprintf`→`strconv` (perfsprint), gofmt-aligned
              literals, and no literal `{{...}}` tokens in agent-guide-rendered prose (the renderGuide
              brace guard)
        - name: section-taxonomy
          description: >-
              the plan follows the canonical shape, a `# Plan:` H1 title, the `date`/`adrs`/`status`
              frontmatter, the three header sections (Goal, Architecture summary, File
              structure), the phases, and the optional Verification/Notes tails, rather than
              re-improvising header field names or presentation
        - name: lifecycle-freeze
          description: >-
              the plan's two-state `status:` lifecycle is honoured; mutable while `Proposed`, flipped
              to `Implemented` in the final commit that freezes it, with implementation findings
              recorded in the Notes section alongside the freeze
        - name: invariant-claim-transition-phase-order
          description: >-
              when a plan removes or replaces an invariant claim, the proof marker moves in the same
              commit that flips the declaring ADR to `Implemented`; a pre-flip phase keeps the existing
              claim and its marker valid, because the claim mutation is checked only in that Implemented
              transaction, never while the ADR remains `Proposed`
        - name: dependency-composition-authority
          description: when a plan changes dependency selection, ownership, or wiring, consult code-design/dependency-composition and reject speculative capability or a capability without one concrete first consumer
        - name: state-ownership-authority
          description: when a plan changes what a value owns, where derived state lives, or the lifetime of a cache, consult code-design/state-ownership and flag a field written after construction, a derivation stored on a value that outlives its operation, and any correctness that rests on a caller remembering to reset, reload, or order a call
        - name: single-home-authority
          description: when the plan introduces or converts a shared policy or mechanism, consult code-design/single-home and flag a task that would add a second implementation of a concern another package already owns, or that justifies a fork by coverage rather than by a materially different contract from a distinct source
        - name: presentation-ownership-authority
          description: when a plan moves or adds the rendering of a result model, consult code-design/presentation-ownership and flag a task that places the rendering outside the package owning the model or crosses a package boundary with a loosely-typed map
        - name: outcome-modeling-authority
          description: when a plan changes how an outcome is surfaced, matched, or asserted, consult code-design/outcome-modeling and flag a task that branches on message substrings, uses a shallow os.Is* predicate, adds an error identity without naming its branching consumer, or shapes a repository-state refusal outside the actionable outcome protocol
        - name: package-composition-authority
          description: when a plan adds a package or exported surface, consult code-design/package-composition and flag a task that creates a package without a one-sentence ownership statement, names a grab-bag home, exports a symbol without naming its outside-package production consumer, or leaves a new exported declaration undocumented
        - name: quoted-claim-body-quantifies-verified-reality
          description: 'a plan task that quotes a claim body verbatim states a future truth the executor will land unexamined: read each universal in the quoted sentence ("every consumer", "alone", "derived by the operation") against the repository at plan time and against what the plan''s own tasks actually make true, and flag any quantifier that outruns both. The decompose plan shipped three such bodies in one plan - a module-wide kind-dispatch universal falsified by in-core sites its tasks never touched, a two-table derivation claim when the tasks sanctioned four files, and a derive-and-thread lifecycle asserted for a value its own design fixed at construction - each caught only at execution review, each forcing a phase-commit rewrite because applied claim prose cannot change without its operation'
    docCurrencyItems:
        - check: the plan schedules updates for every document its changes invalidate, in the same commits
        - check: docs/decisions/INDEX.md task included whenever an ADR status flip is planned
        - check: AGENTS.md update task included when the plan introduces new conventions or changes the workflow chain
