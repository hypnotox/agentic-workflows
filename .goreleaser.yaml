# GoReleaser config for the awf CLI - builds cross-platform release binaries and
# publishes a GitHub Release on a v* tag (see ADR-0030). Hand-maintained, outside
# awf's render/lock set (like .golangci.yml and ./x). Validate with `goreleaser check`.
version: 2

project_name: awf

builds:
  - id: awf
    main: ./cmd/awf
    binary: awf
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: awf-linux
    ids:
      - awf
    # Stable numeric and named ownership lets a rootless user namespace extract
    # Linux tarballs without trying to map the release builder's local account.
    builds_info:
      owner: root
      group: root
      mode: 0755
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: darwin
        formats:
          - none
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
  - id: awf
    ids:
      - awf
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: linux
        formats:
          - none
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Release notes come from the curated changelog/CHANGELOG.md, not commit messages.
# release.yml passes the tagged section through `--release-notes`; that custom input
# makes GoReleaser skip commit-derived generation while leaving its notes-loading pipe enabled.

release:
  draft: false
