# Build the release archives consumed by the generated bootstrap.
version: 2

project_name: awf

builds:
  - id: awf
    main: ./cmd/awf
    binary: awf
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: awf-linux
    ids:
      - awf
    builds_info:
      owner: root
      group: root
      mode: 0755
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: darwin
        formats:
          - none
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
      - src: MIGRATING-v0.50.md
        info:
          owner: root
          group: root
          mode: 0644
  - id: awf
    ids:
      - awf
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: linux
        formats:
          - none
    files:
      - LICENSE
      - README.md
      - MIGRATING-v0.50.md

checksum:
  name_template: checksums.txt

release:
  draft: false
